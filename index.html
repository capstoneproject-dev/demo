<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <title>NAAP | Student Organization Portal</title>
    <meta name="description" content="NAAP ORG is a centralized portal for managing student organizations, memberships, events, attendance, documents, and campus activities.">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
    <link rel="canonical" href="https://www.naaporg.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NAAP ORG">
    <meta property="og:title" content="NAAP | Student Organization Portal">
    <meta property="og:description" content="A centralized portal for managing student organizations, memberships, events, attendance, documents, and campus activities.">
    <meta property="og:url" content="https://www.naaporg.com/">
    <script>
        if ('serviceWorker' in navigator && window.isSecureContext) {
            navigator.serviceWorker.register('sw.js?v=20260919-40', { scope: './' }).catch(() => {});
        }
        /**
         * Main Entry Point - index.html
         * Routes users to appropriate pages based on authentication
         * Simulates PHP session_start() and authentication check
         */
        
        // Check authentication status (simulating PHP $_SESSION)
        // In demo mode, we use localStorage to simulate PHP sessions
        const userId = localStorage.getItem('user_id');
        const username = localStorage.getItem('username');
        
        if (userId && username) {
            // User is logged in, go to dashboard
            window.location.href = 'pages/login.html';
        } else {
            // User not logged in, go to login
            window.location.href = 'pages/login.html';
        }
    </script>
</head>
<body>
    <main>
        <h1>NAAP Student Organization Portal</h1>
        <p>A centralized portal for student organizations, memberships, events, attendance, documents, and campus activities.</p>
        <p><a href="pages/login.html">Continue to the NAAP ORG portal</a></p>
    </main>
</body>
</html>
